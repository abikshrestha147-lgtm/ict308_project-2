<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Search — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar" data-nav></header>
    <main class="page">
      <h1>Search & filters</h1>
      <p class="muted">Find products by name or category</p>
      <div class="toolbar">
        <input id="q" type="search" placeholder="Search products..." />
        <select id="cat">
          <option value="">All categories</option>
        </select>
      </div>
      <div class="grid" id="results"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      Warners.requireRole(["customer"]);
      Warners.renderNav("search");
      const cat = document.getElementById("cat");
      WARNERS_CATEGORIES.forEach((c) => {
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = c;
        cat.appendChild(opt);
      });

      function render() {
        const q = document.getElementById("q").value.trim().toLowerCase();
        const category = cat.value;
        const list = WARNERS_PRODUCTS.filter((p) => {
          const matchQ =
            !q ||
            p.name.toLowerCase().includes(q) ||
            p.subtitle.toLowerCase().includes(q);
          const matchC = !category || p.category === category;
          return matchQ && matchC;
        });
        const results = document.getElementById("results");
        results.innerHTML = list.length
          ? list.map(Warners.productCard).join("")
          : `<div class="empty panel">No products match your search.</div>`;
      }

      document.getElementById("q").addEventListener("input", render);
      cat.addEventListener("change", render);
      document.getElementById("results").addEventListener("click", (e) => {
        const id = e.target.getAttribute("data-add");
        if (id) Warners.addToCart(id);
      });
      render();
    </script>
  </body>
</html>
