<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar" data-nav></header>
    <main class="page">
      <h1>Product catalogue</h1>
      <p class="muted">Admin view — manage products, categories, and rules</p>

      <div class="panel" style="margin-top: 1rem; overflow-x: auto">
        <table class="table" id="catalogue"></table>
      </div>

      <h2 style="margin-top: 2rem" id="categories">Categories</h2>
      <div class="panel" id="cats"></div>

      <h2 style="margin-top: 2rem" id="rules">Recommendation rules</h2>
      <div class="panel" id="rules-box"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      const role = Warners.requireRole(["admin", "owner"]);
      Warners.renderNav(location.hash === "#rules" ? "rules" : "admin");

      document.getElementById("catalogue").innerHTML = `
        <thead>
          <tr>
            <th>Product</th><th>Category</th><th>Price</th><th>Stock</th>
          </tr>
        </thead>
        <tbody>
          ${WARNERS_PRODUCTS.map(
            (p) => `
            <tr>
              <td>${p.emoji} ${p.name}</td>
              <td>${p.category}</td>
              <td>${Warners.money(p.price)}</td>
              <td>${p.stock}</td>
            </tr>`
          ).join("")}
        </tbody>
      `;

      document.getElementById("cats").innerHTML = `
        <div class="row">
          ${WARNERS_CATEGORIES.map((c) => `<span class="badge">${c}</span>`).join("")}
        </div>
      `;

      document.getElementById("rules-box").innerHTML = `
        <table class="table">
          <thead><tr><th>Rule</th><th>When</th><th>Then</th></tr></thead>
          <tbody>
            ${WARNERS_RULES.map(
              (r) => `
              <tr>
                <td>${r.name}</td>
                <td>${r.when}</td>
                <td>${r.then}</td>
              </tr>`
            ).join("")}
          </tbody>
        </table>
        ${
          role === "admin"
            ? `<p class="muted" style="margin-top:0.75rem">Demo admin screen — connect your backend API later to edit these.</p>`
            : `<p class="muted" style="margin-top:0.75rem">Owner can review rules (read-focused demo).</p>`
        }
      `;

      if (location.hash === "#rules") {
        document.getElementById("rules").scrollIntoView({ behavior: "smooth" });
      }
    </script>
  </body>
</html>
