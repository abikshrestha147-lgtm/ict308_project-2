<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Warner's Electronics — Login</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <div class="login-wrap">
      <div class="login-card">
        <h1>Warner's Electronics</h1>
        <p class="muted">
          Choose how you want to sign in. You can switch roles anytime from the
          login screen.
        </p>
        <div class="role-list">
          <button class="role-btn" type="button" data-role="customer">
            <strong>Customer</strong>
            <span>Browse products, search, and use the cart</span>
          </button>
          <button class="role-btn" type="button" data-role="admin">
            <strong>Admin</strong>
            <span>Manage catalogue, categories, and rules</span>
          </button>
          <button class="role-btn" type="button" data-role="owner">
            <strong>Business Owner</strong>
            <span>View reports and recommendation performance</span>
          </button>
        </div>
      </div>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      document.querySelectorAll("[data-role]").forEach((btn) => {
        btn.addEventListener("click", () => {
          const role = btn.getAttribute("data-role");
          Warners.setRole(role);
          if (role === "customer") location.href = "home.html";
          else if (role === "admin") location.href = "admin.html";
          else location.href = "owner.html";
        });
      });
    </script>
  </body>
</html>
