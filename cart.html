<!DOCTYPE html>
<!-- Owner: Sukhman — shopping cart -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Warner Electronics</title>
    <link rel="icon" href="images/warner-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/sukhman.css" />
    <link rel="stylesheet" href="css/theme-dark.css" />
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="home.html">
        <img class="brand-logo" src="images/warner-mark.png" alt="" />
        <span class="brand-text">
          <span class="brand-name">WARNER</span>
          <span class="brand-sub">ELECTRONICS</span>
        </span>
      </a>
    </header>
    <main class="page">
      <h2 class="section-title">Shopping Cart</h2>
      <div class="cart-layout">
        <div>
          <div class="cart-box" id="cart-box"></div>
          <h2 class="section-title" style="margin-top:1.25rem">Recommended add-ons</h2>
          <p class="meta" style="margin-top:-0.35rem;margin-bottom:0.85rem">
            Based on what you’re buying.
          </p>
          <div class="grid" id="cart-recs"></div>
        </div>
        <aside>
          <div class="summary" id="summary"></div>
          <div class="privacy">
            <h3>Privacy reminder</h3>
            <p class="meta" style="margin:0">
              Your browsing and purchases are used only to suggest related products.
            </p>
          </div>
        </aside>
      </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sukhman/cart.js"></script>
  </body>
</html>
