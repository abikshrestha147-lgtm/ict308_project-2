<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cart — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar" data-nav></header>
    <main class="page">
      <h1>Shopping cart</h1>
      <p class="muted">Review items before checkout (demo)</p>
      <div class="panel" style="margin-top: 1rem" id="cart-box"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      Warners.requireRole(["customer"]);
      Warners.renderNav("cart");

      function render() {
        const items = Warners.getCart()
          .map((i) => {
            const p = Warners.productById(i.id);
            return p ? { ...i, product: p } : null;
          })
          .filter(Boolean);

        const box = document.getElementById("cart-box");
        if (!items.length) {
          box.innerHTML = `<div class="empty">Your cart is empty. <a href="home.html">Browse products</a></div>`;
          return;
        }

        const total = items.reduce((s, i) => s + i.product.price * i.qty, 0);
        box.innerHTML = `
          <table class="table">
            <thead>
              <tr><th>Product</th><th>Qty</th><th>Price</th></tr>
            </thead>
            <tbody>
              ${items
                .map(
                  (i) => `
                <tr>
                  <td>${i.product.emoji} ${i.product.name}</td>
                  <td>
                    <input type="number" min="1" value="${i.qty}" data-qty="${i.id}" style="width:4rem;padding:0.35rem;border:1px solid var(--line);border-radius:8px" />
                  </td>
                  <td>${Warners.money(i.product.price * i.qty)}</td>
                </tr>`
                )
                .join("")}
            </tbody>
          </table>
          <div class="row" style="justify-content:space-between;margin-top:1rem">
            <strong>Total: ${Warners.money(total)}</strong>
            <button class="btn" type="button" id="checkout">Checkout (demo)</button>
          </div>
          <p class="muted" style="margin-top:1rem;font-size:0.9rem">
            Privacy reminder: cart data stays in this browser until you clear it.
          </p>
        `;

        box.querySelectorAll("[data-qty]").forEach((input) => {
          input.addEventListener("change", () => {
            Warners.updateQty(input.getAttribute("data-qty"), Number(input.value) || 1);
            render();
          });
        });
        document.getElementById("checkout").onclick = () =>
          Warners.toast("Checkout is a demo — backend can be added later");
      }

      render();
    </script>
  </body>
</html>
