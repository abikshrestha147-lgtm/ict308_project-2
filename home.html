<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar" data-nav></header>
    <main class="page">
      <section class="hero split panel">
        <div>
          <h1>Find tech that fits your setup</h1>
          <p class="muted">
            Browse recommended products for study, work, and home — then add
            what you need to your cart.
          </p>
          <div class="row" style="margin-top: 1rem">
            <a class="btn" href="search.html">Search products</a>
            <a class="btn btn-ghost" href="cart.html">View cart</a>
          </div>
        </div>
        <div class="detail-art tone-sky">🛒</div>
      </section>

      <h2 style="margin-top: 1.5rem">Recommended for you</h2>
      <p class="muted">Popular picks from Warner's Electronics</p>
      <div class="grid" id="product-grid"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      Warners.requireRole(["customer"]);
      Warners.renderNav("home");
      const grid = document.getElementById("product-grid");
      grid.innerHTML = WARNERS_PRODUCTS.map(Warners.productCard).join("");
      grid.addEventListener("click", (e) => {
        const id = e.target.getAttribute("data-add");
        if (id) Warners.addToCart(id);
      });
    </script>
  </body>
</html>
