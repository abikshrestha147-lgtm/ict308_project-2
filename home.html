<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Home — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="site-header" data-header></header>
    <main class="page">
      <section class="hero">
        <h1>Find electronics faster with smart recommendations</h1>
        <p>
          Browse laptops, smartphones, audio accessories and smart home products.
          Recommendations update based on your product views.
        </p>
        <form class="search-row" action="search.html" method="get">
          <input name="q" placeholder="Search laptops, phones, accessories..." />
          <button class="btn" type="submit">Search</button>
        </form>
      </section>

      <div class="pills" id="cats"></div>

      <h2 class="section-title" id="recommended">Featured Products</h2>
      <div class="grid" id="featured"></div>

      <h2 class="section-title" style="margin-top:1.5rem">Recommended for you</h2>
      <div class="grid" id="home-recs"></div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      Warners.requireRole(["customer", "guest"]);
      Warners.renderHeader("products");
      Warners.bindAddButtons();

      document.getElementById("cats").innerHTML = Warners.getCategories()
        .map((c) => `<a class="pill" href="search.html?cat=${encodeURIComponent(c)}">${c}</a>`)
        .join("");

      document.getElementById("featured").innerHTML = Warners.getProducts()
        .slice(0, 4)
        .map(Warners.productCard)
        .join("");

      document.getElementById("home-recs").innerHTML = Warners.getRecommendations()
        .slice(0, 4)
        .map(Warners.productCard)
        .join("");
    </script>
  </body>
</html>
