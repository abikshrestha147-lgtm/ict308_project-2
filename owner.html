<!DOCTYPE html>
<!-- Owner: Kushal — owner dashboard -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Owner Reports — Warner Electronics</title>
    <link rel="icon" href="images/warner-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/kushal.css" />
  </head>
  <body>
    <header class="site-header" data-header>
      <a class="brand" href="home.html">
        <img class="brand-logo" src="images/warner-logo.png" alt="Warner Electronics" />
      </a>
    </header>
    <div class="app-shell">
      <aside class="sidebar">
        <h2>Owner Panel</h2>
        <a class="side-link" href="home.html">Storefront</a>
        <button class="side-link active" type="button" data-tab="reports">Reports</button>
        <button class="side-link" type="button" data-tab="performance">Performance</button>
      </aside>
      <main class="admin-main">
        <section id="view-reports">
          <div id="owner-reports"></div>
        </section>

        <section id="view-performance" hidden>
          <div id="owner-performance"></div>
        </section>
      </main>
    </div>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/kushal/reports.js"></script>
    <script src="js/kushal/owner.js"></script>
  </body>
</html>
