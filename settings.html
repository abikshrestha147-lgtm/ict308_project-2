<!DOCTYPE html>
<!-- Owner: Sukhman — customer settings -->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Settings — Warner Electronics</title>
    <link rel="icon" href="images/warner-logo.png" />
    <link rel="stylesheet" href="css/styles.css" />
    <link rel="stylesheet" href="css/sukhman.css" />
    <link rel="stylesheet" href="css/theme-dark.css" />
  </head>
  <body class="settings-app">
    <header class="site-header" data-header></header>
    <main class="settings-page">
      <div class="settings-shell">
        <!-- Hub -->
        <div id="settings-hub">
          <header class="settings-page-head">
            <h1>Settings</h1>
          </header>

          <button type="button" class="settings-profile-card" data-screen="personal" data-account-only>
            <span class="settings-avatar" id="settings-avatar">W</span>
            <span class="settings-profile-copy">
              <strong id="settings-profile-name">Your name</strong>
              <span id="settings-profile-meta">email · phone</span>
            </span>
            <span class="settings-chevron" aria-hidden="true">›</span>
          </button>

          <a class="settings-profile-card" href="login.html" data-guest-only hidden>
            <span class="settings-avatar">G</span>
            <span class="settings-profile-copy">
              <strong>Guest</strong>
              <span>Sign in to save your details across devices</span>
            </span>
            <span class="settings-chevron" aria-hidden="true">›</span>
          </a>

          <section class="settings-group" data-account-only>
            <h2 class="settings-group-title">Account</h2>
            <div class="settings-list">
              <button type="button" class="settings-row" data-screen="personal">
                <span class="settings-row-label">Personal info</span>
                <span class="settings-row-value" id="hub-personal-summary"></span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <button type="button" class="settings-row" data-screen="address">
                <span class="settings-row-label">Delivery address</span>
                <span class="settings-row-value" id="hub-address-summary"></span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <button type="button" class="settings-row" data-screen="security">
                <span class="settings-row-label">Security</span>
                <span class="settings-row-value">Password</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </section>

          <section class="settings-group" data-guest-only hidden>
            <h2 class="settings-group-title">Account</h2>
            <div class="settings-list">
              <a class="settings-row" href="login.html">
                <span class="settings-row-label">Log in</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </a>
              <a class="settings-row" href="login.html?signup=1">
                <span class="settings-row-label">Create account</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </a>
            </div>
          </section>

          <section class="settings-group" data-account-only>
            <h2 class="settings-group-title">Shopping</h2>
            <div class="settings-list">
              <button type="button" class="settings-row" data-screen="payment">
                <span class="settings-row-label">Payment methods</span>
                <span class="settings-row-value">Manage cards</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <a class="settings-row" href="account.html">
                <span class="settings-row-label">Order history</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </a>
              <a class="settings-row" href="account.html#tracking">
                <span class="settings-row-label">Package tracking</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </a>
            </div>
          </section>

          <section class="settings-group">
            <h2 class="settings-group-title">Preferences</h2>
            <div class="settings-list">
              <button type="button" class="settings-row" data-screen="notifications" data-account-only>
                <span class="settings-row-label">Notifications</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <button type="button" class="settings-row" data-screen="communications" data-account-only>
                <span class="settings-row-label">Communications</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <button type="button" class="settings-row" data-screen="appearance">
                <span class="settings-row-label">Appearance</span>
                <span class="settings-row-value" id="hub-appearance-summary">System</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
            </div>
          </section>

          <section class="settings-group">
            <h2 class="settings-group-title">Privacy</h2>
            <div class="settings-list">
              <button type="button" class="settings-row" data-screen="privacy">
                <span class="settings-row-label">Privacy settings</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </button>
              <button type="button" class="settings-row settings-row--action" id="clear-search-history">
                <span class="settings-row-label">Clear search history</span>
              </button>
            </div>
          </section>

          <section class="settings-group">
            <h2 class="settings-group-title">Support</h2>
            <div class="settings-list">
              <a class="settings-row" href="support.html">
                <span class="settings-row-label">Help centre</span>
                <span class="settings-chevron" aria-hidden="true">›</span>
              </a>
            </div>
          </section>

          <button type="button" class="settings-signout btn btn-outline" data-logout data-account-only>Sign out</button>
          <a class="settings-signout btn" href="login.html" data-guest-only hidden>Sign in</a>
        </div>

        <!-- Detail screens -->
        <div id="settings-detail" hidden>
          <header class="settings-detail-head">
            <button type="button" class="settings-back" id="settings-back">← Settings</button>
            <h1 id="settings-detail-title">Detail</h1>
          </header>
          <div class="settings-detail-body" id="settings-detail-body"></div>
        </div>
      </div>
    </main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script src="js/sukhman/settings.js"></script>
  </body>
</html>
