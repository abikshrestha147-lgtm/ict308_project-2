<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product — Warner's Electronics</title>
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <header class="topbar" data-nav></header>
    <main class="page" id="detail"></main>
    <script src="js/data.js"></script>
    <script src="js/app.js"></script>
    <script>
      Warners.requireRole(["customer"]);
      Warners.renderNav("home");
      const id = new URLSearchParams(location.search).get("id");
      const p = Warners.productById(id);
      const root = document.getElementById("detail");
      if (!p) {
        root.innerHTML = `<div class="panel empty">Product not found. <a href="home.html">Back home</a></div>`;
      } else {
        root.innerHTML = `
          <div class="hero split">
            <div class="detail-art tone-${p.tone}">${p.emoji}</div>
            <div class="panel">
              <h1>${p.name}</h1>
              <p class="muted">${p.subtitle}</p>
              <p class="price" style="font-size:1.4rem;margin:0.75rem 0">${Warners.money(p.price)}</p>
              <p class="muted">${p.description}</p>
              <ul class="specs">${p.specs.map((s) => `<li>${s}</li>`).join("")}</ul>
              <div class="row" style="margin-top:1rem">
                <button class="btn" type="button" id="add">Add to cart</button>
                <a class="btn btn-ghost" href="home.html">Back</a>
              </div>
            </div>
          </div>
          <h2 style="margin-top:1.5rem">You may also like</h2>
          <div class="grid" id="related"></div>
        `;
        document.getElementById("add").onclick = () => Warners.addToCart(p.id);
        const related = WARNERS_PRODUCTS.filter((x) => x.id !== p.id).slice(0, 3);
        const rel = document.getElementById("related");
        rel.innerHTML = related.map(Warners.productCard).join("");
        rel.addEventListener("click", (e) => {
          const pid = e.target.getAttribute("data-add");
          if (pid) Warners.addToCart(pid);
        });
      }
    </script>
  </body>
</html>
